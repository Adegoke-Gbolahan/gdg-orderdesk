name: orderdesk

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    build: .
    container_name: orderdesk
    init: true
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    command: postgres -c max_connections=20
    environment:
      POSTGRES_DB: orderdesk
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
